                codingComfort: '',

            const [savedCareers, setSavedCareers] = useState(() => {
                try {
                    const local = localStorage.getItem('cp_saved_careers');
                    return local ? JSON.parse(local) : ['software_developer'];
                } catch {
                    return ['software_developer'];
                }
            });

            // Roadmap Completion Progress in LocalStorage
            const [roadmapProgress, setRoadmapProgress] = useState(() => {
                try {
                    const local = localStorage.getItem('cp_roadmap_progress');
                    return local ? JSON.parse(local) : { software_developer: [1, 2] };
                } catch {
                    return { software_developer: [1, 2] };
                }
            });

            // Try Activity Ratings in LocalStorage
            const [activityRatings, setActivityRatings] = useState(() => {
                try {
                    const local = localStorage.getItem('cp_activity_ratings');
                    return local ? JSON.parse(local) : {};
                } catch {
                    return {};
                }
            });

            // Save state effects
            useEffect(() => {
                localStorage.setItem('cp_saved_careers', JSON.stringify(savedCareers));
            }, [savedCareers]);

            useEffect(() => {
                localStorage.setItem('cp_roadmap_progress', JSON.stringify(roadmapProgress));
            }, [roadmapProgress]);

            useEffect(() => {
                localStorage.setItem('cp_activity_ratings', JSON.stringify(activityRatings));
            }, [activityRatings]);

            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                }
            }, [theme]);

            // Keyboard shortcut for Cmd+K search
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                        e.preventDefault();
                        setSearchOpen(prev => !prev);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

            const calculatedMatches = useMemo(() => {
                return CAREER_DATABASE.map(career => {
                    let score = 40;

                    if (quizAnswers.degree && career.degreesMatched.includes(quizAnswers.degree)) score += 15;
                    if (quizAnswers.interest && career.suitableInterests.includes(quizAnswers.interest)) score += 20;
                    if (quizAnswers.problemSolving && career.suitableProblems.includes(quizAnswers.problemSolving)) score += 10;
                    if (quizAnswers.codingComfort && career.suitableCoding.includes(quizAnswers.codingComfort)) score += 10;
                    
                    if (quizAnswers.values && quizAnswers.values.length > 0) {
                        const matches = quizAnswers.values.filter(v => career.suitableValues.includes(v));
                        score += Math.min(10, matches.length * 3);
                    }
                    if (quizAnswers.environment && career.suitableEnvs.includes(quizAnswers.environment)) score += 5;

                    const matchPercent = Math.min(96, Math.max(52, score));
                    return { ...career, matchPercent };
                }).sort((a, b) => b.matchPercent - a.matchPercent);
            }, [quizAnswers]);

                                                onClick={() => {
                                                    navigateToDetail(c.id);
                                                    setSearchOpen(false);
                                                    setSearchQuery('');
                                                }}
                                                className="w-full text-left p-3 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-800 light:hover:bg-slate-100 transition-colors flex items-center justify-between"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className="w-8 h-8 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
                                                        <i className={`fa-solid ${c.icon}`}></i>
                                                    </div>
                                                    <div>
                                                        <h4 className="font-bold text-sm text-slate-100 dark:text-slate-100 light:text-slate-900">{c.title}</h4>
                                                        <p className="text-xs text-slate-400">{c.category} • {c.difficulty}</p>
                                                    </div>
                                                </div>
                                                <i className="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                                            </button>
                                        ))
                                    ) : (
                                        <p className="text-xs text-center text-slate-500 py-6">
                                            {searchQuery ? 'No matching careers found' : 'Type a skill, career, or interest...'}
                                        </p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    <main className="flex-1">
                        {activePage === 'home' && (
                            <HomePage 
                                setActivePage={setActivePage}
                                navigateToDetail={navigateToDetail}
                            />
                        )}
                        {activePage === 'quiz' && (
                            <QuizPage 
                                quizAnswers={quizAnswers}
                                setQuizAnswers={setQuizAnswers}
                                setActivePage={setActivePage}
                            />
                        )}
                        {activePage === 'results' && (
                            <ResultsPage 
                                calculatedMatches={calculatedMatches}
                                navigateToDetail={navigateToDetail}
                                compareList={compareList}
                                toggleCompareItem={toggleCompareItem}
                                setActivePage={setActivePage}
                            />
                        )}
                        {activePage === 'explore' && (
                            <ExplorePage 
                                careers={CAREER_DATABASE}
                                navigateToDetail={navigateToDetail}
                                compareList={compareList}
                                toggleCompareItem={toggleCompareItem}
                                savedCareers={savedCareers}
                                toggleBookmarkCareer={toggleBookmarkCareer}
                            />
                        )}
                        {activePage === 'detail' && (
                            <CareerDetailPage 
                                career={getCareerById(selectedCareerId)}
                                setActivePage={setActivePage}
                                toggleCompareItem={toggleCompareItem}
                                isCompared={compareList.includes(selectedCareerId)}
                                savedCareers={savedCareers}
                                toggleBookmarkCareer={toggleBookmarkCareer}
                            />
                        )}
                        {activePage === 'compare' && (
                            <ComparePage 
                                careers={CAREER_DATABASE}
                                compareList={compareList}
                                toggleCompareItem={toggleCompareItem}
                                navigateToDetail={navigateToDetail}
                            />
                        )}
                        {activePage === 'try' && (
                            <TryActivitiesPage 
                                careers={CAREER_DATABASE}
                                activityRatings={activityRatings}
                                setActivityRatings={setActivityRatings}
                                navigateToDetail={navigateToDetail}
                            />
                        )}
                        {activePage === 'roadmap' && (
                            <RoadmapPage 
                                careers={CAREER_DATABASE}
                                roadmapProgress={roadmapProgress}
                                toggleRoadmapStage={toggleRoadmapStage}
                                selectedCareerId={selectedCareerId}
                                setSelectedCareerId={setSelectedCareerId}
                            />
                        )}
                        {activePage === 'internships' && (
                            <InternshipsPage 
                                internships={INTERNSHIP_DATABASE}
                                careers={CAREER_DATABASE}
                                navigateToDetail={navigateToDetail}
                            />
                        )}
                        {activePage === 'resources' && (
                            <ResourcesPage 
                                resources={RESOURCE_DATABASE}
                                careers={CAREER_DATABASE}
                            />
                        )}
                        {activePage === 'dashboard' && (
                            <DashboardPage 
                                careers={CAREER_DATABASE}
                                savedCareers={savedCareers}
                                roadmapProgress={roadmapProgress}
                                activityRatings={activityRatings}
                                navigateToDetail={navigateToDetail}
                                setActivePage={setActivePage}
                            />
                        )}
                    </main>

                    {}
                    <footer className="border-t border-slate-800 dark:border-slate-800 light:border-slate-200 bg-slate-900/50 dark:bg-slate-900/50 light:bg-slate-100 py-10 mt-16 transition-colors">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-black text-sm">
                                    <i className="fa-solid fa-compass"></i>
                                </div>
                                <span className="font-extrabold text-base tracking-tight text-white dark:text-white light:text-slate-900">
                                    Career<span className="text-indigo-500">Path</span>
                                </span>
                                <span className="text-xs text-slate-400 dark:text-slate-400 light:text-slate-600">
                                    • Empowering BCA, B.Tech, BBA, B.Com & Fresh Graduates
                                </span>
                            </div>
                            <div className="flex items-center gap-6 text-xs text-slate-400 dark:text-slate-400 light:text-slate-600 font-medium">
                                <button onClick={() => setActivePage('home')} className="hover:text-indigo-400">Home</button>
                                <button onClick={() => setActivePage('quiz')} className="hover:text-indigo-400">Career Explorer</button>
                                <button onClick={() => setActivePage('try')} className="hover:text-indigo-400">Mini Activities</button>
                                <button onClick={() => setActivePage('roadmap')} className="hover:text-indigo-400">Roadmaps</button>
                                <button onClick={() => setActivePage('dashboard')} className="hover:text-indigo-400">Dashboard</button>
                            </div>
                            <p className="text-xs text-slate-500 dark:text-slate-500 light:text-slate-500">
                                © 2026 CareerPath Platform. Interactive EdTech Exploration Tool.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        function HomePage({ setActivePage, navigateToDetail }) {
            return (
                <div className="space-y-20 pb-16">
                    {/* HERO SECTION */}
                    <section className="relative pt-12 pb-16 overflow-hidden">
                        <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center space-y-8">
                            
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-bold tracking-wide uppercase">
                                <i className="fa-solid fa-sparkles text-amber-400"></i>
                                <span>No More Career Confusion For Graduates</span>
                            </div>

                            <h1 className="text-4xl sm:text-6xl font-black tracking-tight max-w-4xl mx-auto leading-tight text-white dark:text-white light:text-slate-900">
                                Don't choose a career blindly.<br />
                                <span className="gradient-text">Discover a career path that fits YOU.</span>
                            </h1>

                            <p className="text-slate-400 dark:text-slate-400 light:text-slate-600 text-base sm:text-lg max-w-2xl mx-auto font-medium">
                                Answer a few simple questions about your degree, strengths, interests, and preferences to discover personalized, high-growth career options.
                            </p>

                            <div className="flex flex-wrap items-center justify-center gap-4 pt-2">
                                <button 
                                    onClick={() => { setActivePage('quiz'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                    className="px-8 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-base shadow-xl shadow-indigo-600/30 transition-all hover:scale-105 flex items-center gap-2"
                                >
                                    <span>Find My Career</span>
                                    <i className="fa-solid fa-arrow-right"></i>
                                </button>
                                <button 
                                    onClick={() => { setActivePage('explore'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                    className="px-8 py-4 rounded-2xl bg-slate-800 dark:bg-slate-800 light:bg-slate-200 hover:bg-slate-700 text-slate-100 dark:text-slate-100 light:text-slate-900 font-extrabold text-base border border-slate-700 dark:border-slate-700 light:border-slate-300 transition-all"
                                >
                                    Explore Careers
                                </button>
                            </div>

                            {/* Journey Flow Banner */}
                            <div className="pt-8">
                                <div className="inline-flex flex-wrap items-center justify-center gap-3 sm:gap-6 px-6 py-3 rounded-2xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 text-xs sm:text-sm font-semibold text-slate-300 dark:text-slate-300 light:text-slate-700 shadow-xl">
                                    <span className="flex items-center gap-1.5 text-indigo-400"><i className="fa-solid fa-circle-check"></i> Answer</span>
                                    <i className="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                                    <span className="flex items-center gap-1.5 text-purple-400"><i className="fa-solid fa-compass"></i> Discover</span>
                                    <i className="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                                    <span className="flex items-center gap-1.5 text-pink-400"><i className="fa-solid fa-code-compare"></i> Compare</span>
                                    <i className="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                                    <span className="flex items-center gap-1.5 text-emerald-400"><i className="fa-solid fa-vial"></i> Try</span>
                                    <i className="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                                    <span className="flex items-center gap-1.5 text-amber-400"><i className="fa-solid fa-map"></i> Build Roadmap</span>
                                </div>
                            </div>

                        </div>
                    </section>

                    {/* 5-MINUTE CAREER EXPLORER CALLOUT */}
                    <section className="max-w-5xl mx-auto px-4">
                        <div className="rounded-3xl bg-gradient-to-r from-indigo-900/60 via-purple-900/50 to-slate-900 p-8 sm:p-12 border border-indigo-500/30 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-8">
                            <div className="space-y-4 text-center md:text-left">
                                <span className="px-3 py-1 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold uppercase tracking-wider">
                                    Not sure what to choose?
                                </span>
                                <h2 className="text-2xl sm:text-3xl font-extrabold text-white">Take our 5-minute Career Explorer</h2>
                                <p className="text-slate-300 text-sm max-w-lg">
                                    Tailored specifically for BCA, B.Tech, BBA, B.Com and BA students. Get instant percentage match scores for 8+ tech and business roles.
                                </p>
                            </div>
                            <button 
                                onClick={() => { setActivePage('quiz'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                className="px-8 py-4 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm uppercase tracking-wide shadow-xl shadow-amber-500/20 whitespace-nowrap hover:scale-105 transition-all"
                            >
                                Start Career Explorer →
                            </button>
                        </div>
                    </section>

                    {/* FEATURE HIGHLIGHT CARDS */}
                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-10">
                        <div className="text-center space-y-3">
                            <h2 className="text-2xl sm:text-3xl font-black text-white dark:text-white light:text-slate-900">How CareerPath Guides You</h2>
                            <p className="text-slate-400 text-sm">Everything you need to move from college classroom to real-world job placement.</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            {[
                                {
                                    icon: 'fa-wand-magic-sparkles',
                                    color: 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20',
                                    title: '1. Intelligent Matching',
                                    desc: 'Our algorithm analyzes your degree, coding comfort, solving style, and career values to recommend roles where you will thrive.'
                                },
                                {
                                    icon: 'fa-vial',
                                    color: 'text-purple-400 bg-purple-500/10 border-purple-500/20',
                                    title: '2. Try Before You Choose',
                                    desc: 'Simulate mini real-world tasks (coding, UI layout, dataset analysis, QA bug hunting) before committing months to learning.'
                                },
                                {
                                    icon: 'fa-map-location-dot',
                                    color: 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20',
                                    title: '3. Step-by-Step Roadmaps',
                                    desc: 'Follow clear 10-stage actionable roadmaps from basics to fullstack projects, internships, and interview readiness.'
                                }
                            ].map((item, idx) => (
                                <div key={idx} className="p-6 rounded-2xl bg-slate-900/60 dark:bg-slate-900/60 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 shadow-xl space-y-4">
                                    <div className={`w-12 h-12 rounded-xl flex items-center justify-center text-xl border ${item.color}`}>
                                        <i className={`fa-solid ${item.icon}`}></i>
                                    </div>
                                    <h3 className="text-lg font-bold text-white dark:text-white light:text-slate-900">{item.title}</h3>
                                    <p className="text-slate-400 dark:text-slate-400 light:text-slate-600 text-sm leading-relaxed">{item.desc}</p>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* FEATURED CAREER ROLES PREVIEW */}
                    <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div>
                                <h2 className="text-2xl font-black text-white dark:text-white light:text-slate-900">Explore Popular Career Paths</h2>
                                <p className="text-slate-400 text-sm">Discover high-demand roles for college freshers in 2026.</p>
                            </div>
                            <button 
                                onClick={() => { setActivePage('explore'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                className="text-indigo-400 hover:text-indigo-300 font-bold text-sm flex items-center gap-1.5"
                            >
                                View all 8 careers <i className="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                            {CAREER_DATABASE.slice(0, 4).map(career => (
                                <div 
                                    key={career.id}
                                    onClick={() => navigateToDetail(career.id)}
                                    className="p-6 rounded-2xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 shadow-xl hover:border-indigo-500/50 transition-all cursor-pointer group space-y-4"
                                >
                                    <div className="flex items-center justify-between">
                                        <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${career.color} flex items-center justify-center text-white font-bold text-lg shadow-md`}>
                                            <i className={`fa-solid ${career.icon}`}></i>
                                        </div>
                                        <span className={`text-[10px] font-extrabold px-2.5 py-1 rounded-full border ${career.badgeBg}`}>
                                            {career.category}
                                        </span>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-base text-white dark:text-white light:text-slate-900 group-hover:text-indigo-400 transition-colors">{career.title}</h3>
                                        <p className="text-slate-400 text-xs line-clamp-2 mt-1">{career.shortDesc}</p>
                                    </div>
                                    <div className="pt-2 border-t border-slate-800/80 dark:border-slate-800/80 light:border-slate-200 flex items-center justify-between text-xs text-slate-400">
                                        <span>Growth: <strong className="text-emerald-400">{career.careerGrowth.split(' ')[0]}</strong></span>
                                        <span className="text-indigo-400 font-bold group-hover:translate-x-1 transition-transform">Details →</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>
                </div>
            );
        }

        function QuizPage({ quizAnswers, setQuizAnswers, setActivePage }) {
            const [currentStep, setCurrentStep] = useState(1);

            const updateAnswer = (key, value) => {
                setQuizAnswers(prev => ({ ...prev, [key]: value }));
            };

            const toggleValueSelection = (val) => {
                setQuizAnswers(prev => {
                    const current = prev.values || [];
                    const exists = current.includes(val);
                    const updated = exists ? current.filter(v => v !== val) : [...current, val];
                    return { ...prev, values: updated };
                });
            };

            const handleNext = () => {
                if (currentStep < 6) {
                    setCurrentStep(prev => prev + 1);
                } else {
                    setActivePage('results');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            const handleBack = () => {
                if (currentStep > 1) setCurrentStep(prev => prev - 1);
            };

            return (
                <div className="max-w-3xl mx-auto px-4 py-12 space-y-8">
                    {/* Header & Step Indicator */}
                    <div className="space-y-4 text-center">
                        <span className="px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-xs font-bold uppercase tracking-wider">
                            Interactive Career Explorer
                        </span>
                        <h1 className="text-3xl font-black text-white dark:text-white light:text-slate-900">Career Match Questionnaire</h1>
                        
                        {/* Progress Bar */}
                        <div className="space-y-2 max-w-md mx-auto pt-2">
                            <div className="flex items-center justify-between text-xs font-bold text-slate-400">
                                <span>Step {currentStep} of 6</span>
                                <span>{Math.round((currentStep / 6) * 100)}% Completed</span>
                            </div>
                            <div className="w-full h-2.5 rounded-full bg-slate-800 dark:bg-slate-800 light:bg-slate-200 overflow-hidden">
                                <div 
                                    className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-300"
                                    style={{ width: `${(currentStep / 6) * 100}%` }}
                                ></div>
                            </div>
                        </div>
                    </div>

                    {/* Step Card Container */}
                    <div className="p-8 rounded-3xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 shadow-2xl space-y-8">
                        
                        {/* STEP 1: DEGREE */}
                        {currentStep === 1 && (
                            <div className="space-y-6">
                                <div className="space-y-2">
                                    <h2 className="text-xl font-extrabold text-white dark:text-white light:text-slate-900">1. What are you currently studying?</h2>
                                    <p className="text-xs text-slate-400">Select your current graduation degree program.</p>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    {['BCA', 'B.Tech', 'BBA', 'B.Com', 'BA', 'Other'].map(degree => (
                                        <button
                                            key={degree}
                                            onClick={() => updateAnswer('degree', degree)}
                                            className={`p-4 rounded-2xl border font-bold text-sm transition-all text-center ${
                                                quizAnswers.degree === degree
                                                    ? 'bg-indigo-600 text-white border-indigo-500 shadow-lg shadow-indigo-600/30'
                                                    : 'bg-slate-800/50 dark:bg-slate-800/50 light:bg-slate-100 text-slate-300 dark:text-slate-300 light:text-slate-800 border-slate-700/80 hover:border-slate-500'
                                            }`}
                                        >
                                            {degree}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* STEP 2: WORK INTEREST */}
                        {currentStep === 2 && (
                            <div className="space-y-6">
                                <div className="space-y-2">
                                    <h2 className="text-xl font-extrabold text-white dark:text-white light:text-slate-900">2. What type of work interests you most?</h2>
                                    <p className="text-xs text-slate-400">Choose the domain that aligns best with your curiosity.</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {[
                                        { label: 'Coding & Building', icon: 'fa-laptop-code' },
                                        { label: 'Data & Analysis', icon: 'fa-chart-pie' },
                                        { label: 'Designing & Creativity', icon: 'fa-pen-ruler' },
                                        { label: 'Business & Management', icon: 'fa-briefcase' },
                                        { label: 'Cybersecurity', icon: 'fa-shield-halved' },
                                        { label: 'Artificial Intelligence', icon: 'fa-brain' },
                                        { label: 'Communication & People', icon: 'fa-bullhorn' }
                                    ].map(item => (
                                        <button
                                            key={item.label}
                                            onClick={() => updateAnswer('interest', item.label)}
                                            className={`p-4 rounded-2xl border font-bold text-sm transition-all flex items-center gap-3 text-left ${
                                                quizAnswers.interest === item.label
                                                    ? 'bg-indigo-600 text-white border-indigo-500 shadow-lg shadow-indigo-600/30'
                                                    : 'bg-slate-800/50 dark:bg-slate-800/50 light:bg-slate-100 text-slate-300 dark:text-slate-300 light:text-slate-800 border-slate-700/80 hover:border-slate-500'
                                            }`}
                                        >
                                            <i className={`fa-solid ${item.icon} text-base`}></i>
                                            <span>{item.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* STEP 3: ENJOY SOLVING */}
                        {currentStep === 3 && (
                            <div className="space-y-6">
                                <div className="space-y-2">
                                    <h2 className="text-xl font-extrabold text-white dark:text-white light:text-slate-900">3. What do you enjoy solving?</h2>
                                    <p className="text-xs text-slate-400">Pick the problem style you find naturally rewarding.</p>
                                </div>
                                <div className="space-y-3">
                                    {[
                                        'Technical problems',
                                        'Business problems',
                                        'Logical problems',
                                        'Creative problems',
                                        'People-related problems'
                                    ].map(prob => (
                                        <button
                                            key={prob}
                                            onClick={() => updateAnswer('problemSolving', prob)}
                                            className={`w-full p-4 rounded-2xl border font-bold text-sm transition-all text-left flex items-center justify-between ${
                                                quizAnswers.problemSolving === prob
                                                    ? 'bg-indigo-600 text-white border-indigo-500 shadow-lg shadow-indigo-600/30'
                                                    : 'bg-slate-800/50 dark:bg-slate-800/50 light:bg-slate-100 text-slate-300 dark:text-slate-300 light:text-slate-800 border-slate-700/80 hover:border-slate-500'
                                            }`}
                                        >
                                            <span>{prob}</span>
                                            {quizAnswers.problemSolving === prob && <i className="fa-solid fa-circle-check"></i>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* STEP 4: CODING COMFORT */}
                        {currentStep === 4 && (
                            <div className="space-y-6">
                                <div className="space-y-2">
                                    <h2 className="text-xl font-extrabold text-white dark:text-white light:text-slate-900">4. How comfortable are you with coding?</h2>
                                    <p className="text-xs text-slate-400">Be honest! We have great non-coding and light-coding options too.</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {[
                                        { label: 'Beginner', desc: 'No prior coding experience or basic HTML.' },
                                        { label: 'Some experience', desc: 'Know basic loops, variables in C/Python.' },
                                        { label: 'Comfortable', desc: 'Can write logic, functions, and mini projects.' },
                                        { label: 'Advanced', desc: 'Comfortable with DSA, frameworks, & APIs.' }
                                    ].map(item => (
                                        <button
                                            key={item.label}
                                            onClick={() => updateAnswer('codingComfort', item.label)}
                                            className={`p-4 rounded-2xl border transition-all text-left space-y-1 ${
                                                quizAnswers.codingComfort === item.label

        function SoftwareDevActivity({ rateActivity, rating }) {
            const [selectedFix, setSelectedFix] = useState(null);
            const [status, setStatus] = useState('');

            const checkFix = (choice) => {
                setSelectedFix(choice);
                if (choice === 'correct') {
                    setStatus('✅ Great job! You fixed the array index out-of-bounds bug.');
                } else {
                    setStatus('❌ Not quite. Check the loop condition bounds.');
                }
            };

            return (
                <div className="space-y-6">
                    <div>
                        <span className="text-xs font-black uppercase text-indigo-400">Mini Task: Software Developer</span>
                        <h2 className="text-xl font-extrabold text-white dark:text-white light:text-slate-900 mt-1">Fix a Simple Coding Bug</h2>
                        <p className="text-xs text-slate-400">A junior developer wrote a loop to print numbers, but it throws an error. Find the fix!</p>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-950 font-mono text-xs text-emerald-400 border border-slate-800 space-y-1">
                        <div className="text-slate-500">// Buggy JavaScript Code</div>
                        <div>let numbers = [10, 20, 30];</div>
                        <div className="text-rose-400">for (let i = 0; i &lt;= numbers.length; i++) &#123;</div>
                        <div className="pl-4">console.log(numbers[i]); // Throws undefined at index 3</div>
                        <div>&#125;</div>
                    </div>

                    <div className="space-y-2">
                        <p className="text-xs font-bold text-slate-300">Which line fixes the loop bounds error?</p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                        {/* Metric Highlights */}

                        {/* LEFT 2 COLUMNS */}

                                            <span className="w-5 h-5 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-[10px] shrink-0 mt-0.5">{tIdx + 1}</span>

                                <div className="space-y-3">

                                        {career.keySkills.map((sk, skIdx) => (
                                            <span key={skIdx} className="px-3 py-1.5 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-xs font-bold">

        function RoadmapPage({ careers, roadmapProgress, toggleRoadmapStage, selectedCareerId, setSelectedCareerId }) {
            const career = careers.find(c => c.id === selectedCareerId) || careers[0];
            const stages = ROADMAP_DATA[career.id] || ROADMAP_DATA['software_developer'];
            const completedStages = roadmapProgress[career.id] || [];
            const progressPercent = Math.round((completedStages.length / stages.length) * 100);

            return (
                <div className="max-w-5xl mx-auto px-4 py-12 space-y-10">
                    <div className="text-center space-y-3">
                        <span className="px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-xs font-bold uppercase tracking-wider">
                            10-Stage Career Roadmap
                        </span>
                        <h1 className="text-3xl font-black text-white dark:text-white light:text-slate-900">Personalized Career Roadmap</h1>
                        <p className="text-slate-400 text-sm max-w-lg mx-auto">
                            Step-by-step guidance from baseline skills to internships, resume building, and job offer.
                        </p>
                    </div>

                    {/* Role Selection Dropdown */}
                    <div className="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 rounded-2xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200">
                        <div className="flex items-center gap-3">
                            <span className="text-xs font-bold text-slate-400">Select Goal Role:</span>
                            <select 
                                value={selectedCareerId}
                                onChange={(e) => setSelectedCareerId(e.target.value)}
                                className="bg-slate-950 dark:bg-slate-950 light:bg-slate-100 text-slate-100 dark:text-slate-100 light:text-slate-900 font-bold text-xs p-2.5 rounded-xl border border-slate-700 outline-none"
                            >
                                {careers.map(c => (
                                    <option key={c.id} value={c.id}>{c.title}</option>
                                ))}
                            </select>
                        </div>

                        {/* Progress Bar Header */}
                        <div className="flex items-center gap-4 w-full sm:w-auto">
                            <div className="text-xs font-bold text-slate-300">Progress: <span className="text-indigo-400">{progressPercent}%</span></div>
                            <div className="w-32 h-2.5 rounded-full bg-slate-800 overflow-hidden">
                                <div className="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>
                            </div>
                        </div>
                    </div>

                    {/* ROADMAP STAGES VERTICAL TIMELINE */}
                    <div className="space-y-4">
                        {stages.map((st) => {
                            const isDone = completedStages.includes(st.stage);

                            return (
                                <div 
                                    key={st.stage}
                                    onClick={() => toggleRoadmapStage(career.id, st.stage)}
                                    className={`p-6 rounded-3xl border transition-all cursor-pointer flex items-start gap-4 ${
                                        isDone
                                            ? 'bg-emerald-950/20 dark:bg-emerald-950/20 light:bg-emerald-50 border-emerald-500/40 shadow-lg'
                                            : 'bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 hover:border-slate-700'
                                    }`}
                                >
                                    <div className={`w-9 h-9 rounded-xl font-black text-xs flex items-center justify-center shrink-0 mt-0.5 ${
                                        isDone ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/30' : 'bg-slate-800 text-slate-300'
                                    }`}>
                                        {isDone ? '✓' : st.stage}
                                    </div>

                                    <div className="flex-1 space-y-1">
                                        <div className="flex items-center justify-between">
                                            <h3 className={`font-extrabold text-base ${isDone ? 'text-emerald-400 dark:text-emerald-400 light:text-emerald-700 line-through' : 'text-white dark:text-white light:text-slate-900'}`}>
                                                Stage {st.stage}: {st.title}
                                            </h3>
                                            <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full border ${
                                                isDone ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'
                                            }`}>
                                                {isDone ? 'Completed' : 'Pending'}
                                            </span>
                                        </div>
                                        <p className="text-xs text-slate-400 dark:text-slate-400 light:text-slate-600 leading-relaxed">{st.desc}</p>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function ExplorePage({ careers, navigateToDetail, compareList, toggleCompareItem, savedCareers, toggleBookmarkCareer }) {
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchFilter, setSearchFilter] = useState('');

            const filteredCareers = careers.filter(c => {
                const matchesCat = selectedCategory === 'All' || c.category === selectedCategory;
                const matchesSearch = c.title.toLowerCase().includes(searchFilter.toLowerCase()) || c.shortDesc.toLowerCase().includes(searchFilter.toLowerCase());
                return matchesCat && matchesSearch;
            });

            return (
                <div className="max-w-7xl mx-auto px-4 py-12 space-y-10">
                    <div className="text-center space-y-3">
                        <span className="px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-xs font-bold uppercase tracking-wider">
                            Comprehensive Career Library
                        </span>
                        <h1 className="text-3xl font-black text-white dark:text-white light:text-slate-900">Explore High-Demand Tech & Business Roles</h1>
                        <p className="text-slate-400 text-sm max-w-lg mx-auto">
                            Filter and research careers tailored for BCA, B.Tech, BBA, B.Com and BA freshers.
                        </p>
                    </div>

                    {/* Filter Bar */}
                    <div className="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 rounded-2xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200">
                        {/* Category Chips */}
                        <div className="flex flex-wrap gap-2">
                            {['All', 'Technology', 'Data & AI', 'Design', 'Business'].map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setSelectedCategory(cat)}
                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                        selectedCategory === cat ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-800 text-slate-400 hover:text-slate-200'
                                    }`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        {/* Search Input */}
                        <div className="w-full sm:w-64 relative">
                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-500"></i>
                            <input 
                                type="text"
                                placeholder="Filter careers..."
                                value={searchFilter}
                                onChange={(e) => setSearchFilter(e.target.value)}
                                className="w-full pl-8 pr-3 py-1.5 rounded-xl bg-slate-950 dark:bg-slate-950 light:bg-slate-100 text-xs text-slate-100 dark:text-slate-100 light:text-slate-900 border border-slate-800 outline-none"
                            />
                        </div>
                    </div>

                    {/* CAREER CARDS GRID */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredCareers.map(career => {
                            const isSaved = savedCareers.includes(career.id);
                            const isCompared = compareList.includes(career.id);

                            return (
                                <div 
                                    key={career.id}
                                    className="p-6 rounded-3xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 shadow-xl flex flex-col justify-between space-y-6 hover:border-indigo-500/40 transition-all"
                                >
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between">
                                            <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${career.color} flex items-center justify-center text-white text-xl font-bold shadow-md`}>
                                                <i className={`fa-solid ${career.icon}`}></i>
                                            </div>
                                            <button 
                                                onClick={() => toggleBookmarkCareer(career.id)}
                                                className="text-slate-500 hover:text-amber-400 text-sm p-1"
                                            >
                                                <i className={`fa-solid fa-bookmark ${isSaved ? 'text-amber-400' : ''}`}></i>
                                            </button>
                                        </div>

                                        <div>
                                            <span className={`text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full border ${career.badgeBg}`}>
                                                {career.category}
                                            </span>
                                            <h3 className="text-lg font-bold text-white dark:text-white light:text-slate-900 mt-2">{career.title}</h3>
                                            <p className="text-xs text-slate-400 mt-1 line-clamp-2">{career.shortDesc}</p>
                                        </div>

                                        <div className="space-y-1.5 text-xs text-slate-400 pt-2 border-t border-slate-800/80">
                                            <div>Salary: <strong className="text-amber-400">{career.avgSalary}</strong></div>
                                            <div>Coding: <strong className="text-slate-200 dark:text-slate-200 light:text-slate-800">{career.codingReq}</strong></div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-2 pt-2">
                                        <button 
                                            onClick={() => toggleCompareItem(career.id)}
                                            className={`p-2.5 rounded-xl border text-xs font-bold transition-all ${
                                                isCompared ? 'bg-purple-600/20 text-purple-300 border-purple-500/40' : 'bg-slate-800 text-slate-400 border-slate-700'
                                            }`}
                                            title="Compare"
                                        >
                                            <i className="fa-solid fa-code-compare"></i>
                                        </button>
                                        <button 
                                            onClick={() => navigateToDetail(career.id)}
                                            className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-extrabold shadow-md transition-all text-center"
                                        >
                                            View Career Details →
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function InternshipsPage({ internships, careers, navigateToDetail }) {
            const [selectedCategory, setSelectedCategory] = useState('All');

            const filteredInternships = internships.filter(int => {
                return selectedCategory === 'All' || int.roleCategory === selectedCategory;
            });

            return (
                <div className="max-w-6xl mx-auto px-4 py-12 space-y-10">
                    <div className="text-center space-y-3">
                        <span className="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold uppercase tracking-wider">
                            Early Career Placements
                        </span>
                        <h1 className="text-3xl font-black text-white dark:text-white light:text-slate-900">Internship Opportunities for Graduates</h1>
                        <p className="text-slate-400 text-sm max-w-lg mx-auto">
                            Discover entry-level internship listings with clear stipend ranges and skill requirements.
                        </p>
                    </div>

                    {/* Filter Tabs */}
                    <div className="flex flex-wrap items-center justify-center gap-2">
                        <button
                            onClick={() => setSelectedCategory('All')}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                selectedCategory === 'All' ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-800 text-slate-400'
                            }`}
                        >
                            All Roles
                        </button>
                        {careers.map(c => (
                            <button
                                key={c.id}
                                onClick={() => setSelectedCategory(c.id)}
                                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                    selectedCategory === c.id ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-800 text-slate-400'
                                }`}
                            >
                                {c.title}
                            </button>
                        ))}
                    </div>

                    {/* LISTINGS */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {filteredInternships.map(item => (
                            <div key={item.id} className="p-6 rounded-3xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 shadow-xl space-y-4">
                                <div className="flex items-start justify-between gap-4">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-10 h-10 rounded-xl ${item.color} flex items-center justify-center text-white text-base font-bold shadow-md`}>
                                            <i className={`fa-solid ${item.logo}`}></i>
                                        </div>
                                        <div>
                                            <h3 className="font-extrabold text-base text-white dark:text-white light:text-slate-900">{item.title}</h3>
                                            <span className="text-xs font-semibold text-slate-400">{item.company}</span>
                                        </div>
                                    </div>
                                    <span className="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-black text-xs">
                                        {item.stipend}
                                    </span>
                                </div>

                                <p className="text-xs text-slate-300 dark:text-slate-300 light:text-slate-700 leading-relaxed">{item.desc}</p>

                                <div className="flex flex-wrap gap-1.5">
                                    {item.skills.map((sk, sIdx) => (
                                        <span key={sIdx} className="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 text-[10px] font-bold">
                                            {sk}
                                        </span>
                                    ))}
                                </div>

                                <div className="pt-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
                                    <span>📍 {item.location} • {item.duration}</span>
                                    <button 
                                        onClick={() => navigateToDetail(item.roleCategory)}
                                        className="text-indigo-400 font-bold hover:underline"
                                    >
                                        Role Requirements →
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ResourcesPage({ resources, careers }) {
            const [selectedRole, setSelectedRole] = useState('All');

            const filteredResources = resources.filter(r => selectedRole === 'All' || r.category === selectedRole);

            return (
                <div className="max-w-6xl mx-auto px-4 py-12 space-y-10">
                    <div className="text-center space-y-3">
                        <span className="px-3 py-1 rounded-full bg-purple-500/20 text-purple-400 border border-purple-500/30 text-xs font-bold uppercase tracking-wider">
                            Curated Learning Library
                        </span>
                        <h1 className="text-3xl font-black text-white dark:text-white light:text-slate-900">Learning Resources & Course Guides</h1>
                        <p className="text-slate-400 text-sm max-w-lg mx-auto">
                            Free courses, documentation, YouTube channels, and practice platforms organized by career.
                        </p>
                    </div>

                    <div className="flex flex-wrap items-center justify-center gap-2">
                        <button
                            onClick={() => setSelectedRole('All')}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                selectedRole === 'All' ? 'bg-purple-600 text-white shadow-md' : 'bg-slate-800 text-slate-400'
                            }`}
                        >
                            All Resources
                        </button>
                        {careers.map(c => (
                            <button
                                key={c.id}
                                onClick={() => setSelectedRole(c.id)}
                                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                    selectedRole === c.id ? 'bg-purple-600 text-white shadow-md' : 'bg-slate-800 text-slate-400'
                                }`}
                            >
                                {c.title}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {filteredResources.map((res, rIdx) => (
                            <div key={rIdx} className="p-6 rounded-3xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 shadow-xl space-y-4 flex flex-col justify-between">
                                <div className="space-y-3">
                                    <div className="flex items-center justify-between">
                                        <div className="w-10 h-10 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-lg font-bold">
                                            <i className={`fa-solid ${res.icon}`}></i>
                                        </div>
                                        <span className="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                                            {res.type}
                                        </span>
                                    </div>
                                    <h3 className="font-extrabold text-base text-white dark:text-white light:text-slate-900">{res.title}</h3>
                                    <p className="text-xs text-slate-400">Provider: <strong className="text-slate-200">{res.provider}</strong></p>
                                </div>

                                <a 
                                    href={res.link} 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-indigo-400 font-extrabold text-xs text-center block transition-colors border border-slate-700"
                                >
                                    Access Resource <i className="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1"></i>
                                </a>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function DashboardPage({ careers, savedCareers, roadmapProgress, activityRatings, navigateToDetail, setActivePage }) {
            const savedCareerObjects = careers.filter(c => savedCareers.includes(c.id));
            const totalActivitiesDone = Object.keys(activityRatings).length;

            return (
                <div className="max-w-6xl mx-auto px-4 py-12 space-y-10">
                    <div className="p-8 rounded-3xl bg-gradient-to-r from-indigo-900/60 via-slate-900 to-purple-900/50 border border-indigo-500/30 shadow-2xl space-y-4">
                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div>
                                <h1 className="text-3xl font-black text-white">Welcome back, Student 👋</h1>
                                <p className="text-slate-300 text-sm mt-1">Track your active roadmaps, saved career roles, and activity feedback.</p>
                            </div>
                            <button 
                                onClick={() => { setActivePage('quiz'); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
                                className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs shadow-lg shadow-indigo-600/30 transition-all"
                            >
                                Retake Career Quiz
                            </button>
                        </div>
                    </div>

                    {/* METRIC OVERVIEW CARDS */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div className="p-6 rounded-3xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 shadow-xl space-y-2">
                            <div className="text-xs font-bold text-slate-400 uppercase">Saved Careers</div>
                            <div className="text-3xl font-black text-white dark:text-white light:text-slate-900">{savedCareers.length}</div>
                            <p className="text-[11px] text-slate-500">Roles saved in your personal library</p>
                        </div>

                        <div className="p-6 rounded-3xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 shadow-xl space-y-2">
                            <div className="text-xs font-bold text-slate-400 uppercase">Activities Completed</div>
                            <div className="text-3xl font-black text-indigo-400">{totalActivitiesDone}</div>
                            <p className="text-[11px] text-slate-500">Mini career tasks simulated</p>
                        </div>

                        <div className="p-6 rounded-3xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 shadow-xl space-y-2">
                            <div className="text-xs font-bold text-slate-400 uppercase">Roadmaps In Progress</div>
                            <div className="text-3xl font-black text-emerald-400">{Object.keys(roadmapProgress).length}</div>
                            <p className="text-[11px] text-slate-500">Active learning roadmaps</p>
                        </div>
                    </div>

                    {/* SAVED CAREERS & ACTIVE ROADMAPS */}
                    <div className="space-y-6">
                        <h2 className="text-xl font-black text-white dark:text-white light:text-slate-900">Your Saved Careers</h2>
                        {savedCareerObjects.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {savedCareerObjects.map(career => {
                                    const doneStages = (roadmapProgress[career.id] || []).length;
                                    const totalStages = (ROADMAP_DATA[career.id] || []).length || 10;
                                    const pct = Math.round((doneStages / totalStages) * 100);

                                    return (
                                        <div key={career.id} className="p-6 rounded-3xl bg-slate-900/80 dark:bg-slate-900/80 light:bg-white border border-slate-800 dark:border-slate-800 light:border-slate-200 shadow-xl space-y-4">
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${career.color} flex items-center justify-center text-white text-lg font-bold shadow-md`}>
                                                        <i className={`fa-solid ${career.icon}`}></i>
                                                    </div>
                                                    <div>
                                                        <h3 className="font-extrabold text-base text-white dark:text-white light:text-slate-900">{career.title}</h3>
                                                        <span className="text-xs text-slate-400">{career.category}</span>
                                                    </div>
                                                </div>
                                                <button 
                                                    onClick={() => navigateToDetail(career.id)}
                                                    className="px-3 py-1.5 rounded-xl bg-indigo-600/20 text-indigo-400 text-xs font-bold border border-indigo-500/30"
                                                >
                                                    View Details
                                                </button>
                                            </div>

                                            {/* Roadmap progress bar */}
                                            <div className="space-y-1.5 pt-2 border-t border-slate-800">
                                                <div className="flex justify-between text-xs text-slate-400 font-bold">
                                                    <span>Roadmap Completion</span>
                                                    <span className="text-emerald-400">{pct}%</span>
                                                </div>
                                                <div className="w-full h-2 rounded-full bg-slate-800 overflow-hidden">
                                                    <div className="h-full bg-emerald-500 rounded-full" style={{ width: `${pct}%` }}></div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        ) : (
                            <p className="text-xs text-slate-500">No saved careers yet. Explore the career library to save roles!</p>
                        )}
                    </div>
                </div>
            );
        }

        window.onload = function() {
            const rootElement = document.getElementById('root');
            if (rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<App />);
            }
        };
    </script>
</body>
</html>
